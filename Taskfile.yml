version: "3"

# Traefik, Mailpit and the external `proxy` network are the shared
# tbc-localdev-infra stack; `task infra:up` starts it. Optional, so a checkout
# without it (CI) still loads every task that doesn't need it. Conventions:
# ~/projects/tbc-localdev-infra/CONVENTIONS.md.
includes:
  infra:
    taskfile: ~/projects/tbc-localdev-infra/Taskfile.yml
    dir: ~/projects/tbc-localdev-infra
    optional: true

# Everything but the release tasks and db:refresh runs INSIDE the
# boone-gifts-backend container, never on the host: the container's /opt/venv is
# the single toolchain, so there is no host Python or .venv to keep in step.
vars:
  COMPOSE: docker compose
  SVC: boone-gifts-backend
  EXEC: "{{.COMPOSE}} exec {{.SVC}}"

tasks:
  up:
    desc: Start the shared infra, then the backend container (detached; does not rebuild)
    cmds:
      - task: infra:up
      - "{{.COMPOSE}} up -d"

  down:
    desc: Stop and remove the backend container (leaves the shared infra running)
    cmd: "{{.COMPOSE}} down"

  restart:
    desc: Restart the backend container
    cmd: "{{.COMPOSE}} restart {{.SVC}}"

  build:
    desc: Rebuild the image and recreate the backend container (after a dependency or Dockerfile change)
    cmds:
      - "{{.COMPOSE}} build"
      - "{{.COMPOSE}} up -d"

  logs:
    desc: Follow the backend container logs
    cmd: "{{.COMPOSE}} logs -f {{.SVC}}"

  shell:
    desc: Open a shell in the backend container
    cmd: "{{.EXEC}} bash"

  ps:
    desc: Show the backend container's status
    cmd: "{{.COMPOSE}} ps"

  deps:lock:
    desc: Regenerate uv.lock from pyproject.toml
    cmd: "{{.EXEC}} uv lock"

  deps:add:
    desc: "Add a package (usage: task deps:add -- <package>), then `task build`"
    cmd: "{{.EXEC}} uv add {{.CLI_ARGS}}"

  deps:add-dev:
    desc: "Add a dev package to the `dev` dependency group (usage: task deps:add-dev -- <package>), then `task build`"
    cmd: "{{.EXEC}} uv add --dev {{.CLI_ARGS}}"

  deps:remove:
    desc: "Remove a package (usage: task deps:remove -- <package>; add `--dev` for a dev one), then `task build`"
    cmd: "{{.EXEC}} uv remove {{.CLI_ARGS}}"

  test:
    desc: "Run the test suite (usage: task test [-- tests/routers/test_auth.py])"
    cmd: "{{.EXEC}} pytest {{.CLI_ARGS}}"

  # Not yet clean on the existing code, so neither CI nor the pre-commit hooks
  # run these four; they are here so ruff and pyright never need a host Python.
  lint:
    desc: "Run ruff check (usage: task lint [-- --fix])"
    cmd: "{{.EXEC}} ruff check {{.CLI_ARGS}} ."

  format:
    desc: "Run ruff format (usage: task format [-- <ruff args>])"
    cmd: "{{.EXEC}} ruff format {{.CLI_ARGS}} ."

  format:check:
    desc: "Check ruff formatting without writing (usage: task format:check [-- <paths>])"
    cmd: '{{.EXEC}} ruff format --check {{.CLI_ARGS | default "."}}'

  typecheck:
    desc: Run pyright
    cmd: "{{.EXEC}} pyright"

  create-admin:
    desc: "Create an admin user (usage: task create-admin)"
    cmd: "{{.EXEC}} python -m app.cli.create_admin"

  show-telemetry:
    desc: Print the release and environment errors are reported under
    cmd: "{{.EXEC}} python -m app.cli.show_telemetry"

  migrate:
    desc: Run database migrations
    cmd: "{{.EXEC}} alembic upgrade head"

  makemigration:
    desc: "Create a new migration (usage: task makemigration -- 'description')"
    cmd: '{{.EXEC}} alembic revision --autogenerate -m "{{.CLI_ARGS}}"'

  # Runs on the HOST: it fetches the backup from the Storage Box over ssh, which
  # the container has no key for. Its migrate and anonymize steps exec into the
  # backend container, so that has to be up. Config is in .env.local.
  db:refresh:
    desc: Replace the local database with the latest prod daily backup, anonymized (prompts first)
    cmd: scripts/refresh_db.sh

  # Release tasks run on the HOST, not in the container: git, git-cliff and gh
  # live here and the container has neither the remote nor the credentials.
  # That is why these tasks don't use {{.EXEC}}.

  release-branch:
    desc: "Cut the next release branch from the default branch (usage: task release-branch [-- --major|--minor|--patch])"
    silent: true
    cmd: |
      set -eu

      BUMP=minor
      case "{{.CLI_ARGS}}" in
        ""|--minor) ;;
        --major) BUMP=major ;;
        --patch) BUMP=patch ;;
        *) echo "unknown argument '{{.CLI_ARGS}}' -- expected --major, --minor or --patch" >&2; exit 1 ;;
      esac

      if ! git diff --quiet || ! git diff --cached --quiet; then
        echo "working tree is dirty -- commit or stash first" >&2; exit 1
      fi

      git fetch origin --prune --tags

      DEFAULT=$(git symbolic-ref --short refs/remotes/origin/HEAD 2>/dev/null | sed 's#^origin/##' || true)
      [ -n "$DEFAULT" ] || DEFAULT=main

      # No releases yet -> start from v0.0.0 so a minor bump gives v0.1.0.
      LATEST=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
      [ -n "$LATEST" ] || LATEST=v0.0.0
      V=${LATEST#v}
      case "$V" in
        [0-9]*.[0-9]*.[0-9]*) ;;
        *) echo "latest release '$LATEST' is not vMAJOR.MINOR.PATCH -- cut the branch by hand" >&2; exit 1 ;;
      esac
      MAJOR=${V%%.*}
      REST=${V#*.}
      MINOR=${REST%%.*}
      PATCH=${REST#*.}
      case "$BUMP" in
        major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
        minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
        patch) PATCH=$((PATCH + 1)) ;;
      esac
      NEXT="v$MAJOR.$MINOR.$PATCH"
      BRANCH="release/$NEXT"

      if git show-ref --verify --quiet "refs/heads/$BRANCH" || git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
        echo "$BRANCH already exists -- nothing to cut" >&2; exit 1
      fi

      git switch -c "$BRANCH" "origin/$DEFAULT"
      git push -u origin "$BRANCH"
      echo "cut $BRANCH from origin/$DEFAULT ($BUMP bump from $LATEST)"

  release-notes:
    desc: Regenerate RELEASE_NOTES.md for the current release and merge the PR into the release branch
    silent: true
    cmd: |
      set -eu

      if ! git diff --quiet || ! git diff --cached --quiet; then
        echo "working tree is dirty -- commit or stash first" >&2; exit 1
      fi

      git fetch origin --prune --tags

      DEFAULT=$(git symbolic-ref --short refs/remotes/origin/HEAD 2>/dev/null | sed 's#^origin/##' || true)
      [ -n "$DEFAULT" ] || DEFAULT=main

      # The release branch we're on, else the highest release branch not yet merged.
      RELEASE=$(git rev-parse --abbrev-ref HEAD)
      case "$RELEASE" in
        release/v*) ;;
        *) RELEASE=$(git branch -r --no-merged "origin/$DEFAULT" --list 'origin/release/v*' | sed 's#^[* ]*origin/##' | sort -V | tail -1) ;;
      esac
      [ -n "$RELEASE" ] || { echo "no release/v* branch found -- run 'task release-branch' first" >&2; exit 1; }

      # release/v0.5.0 -> v0.5.0. The branch name is the version; nothing else tracks it.
      VERSION=${RELEASE#release/}
      WORK="docs/release-notes-$VERSION"

      if git show-ref --verify --quiet "refs/heads/$WORK"; then
        echo "$WORK already exists -- finish or delete that branch first" >&2; exit 1
      fi

      git switch -c "$WORK" "origin/$RELEASE"
      git cliff --tag "$VERSION" -u --prepend RELEASE_NOTES.md

      if git diff --quiet -- RELEASE_NOTES.md; then
        echo "no unreleased commits since the last tag -- nothing to write"
        git switch -
        git branch -D "$WORK"
        exit 0
      fi

      git add RELEASE_NOTES.md
      git commit -m "docs(release-notes): add $VERSION notes"
      git push -u origin "$WORK"

      PR=$(gh pr create --base "$RELEASE" --head "$WORK" \
        --title "docs(release-notes): add $VERSION notes" \
        --body "Release notes for $VERSION, generated by git cliff via 'task release-notes'.")
      echo "opened $PR"

      # A check run can take minutes to register; --watch returns immediately when
      # none exist yet, so wait for one to appear before watching it.
      echo "waiting for CI to register..."
      for i in $(seq 1 20); do
        if OUT=$(gh pr checks "$PR" 2>&1); then
          break
        fi
        case "$OUT" in
          *"no checks reported"*) sleep 30 ;;
          *) break ;;
        esac
      done

      if command -v timeout >/dev/null 2>&1; then
        WATCH="timeout 1800 gh"
      else
        WATCH=gh
      fi
      if ! $WATCH pr checks "$PR" --watch --fail-fast --interval 10; then
        echo "CI did not pass -- $PR left open, nothing merged" >&2; exit 1
      fi

      if git show-ref --verify --quiet "refs/heads/$RELEASE"; then
        git switch "$RELEASE"
      else
        git switch -c "$RELEASE" "origin/$RELEASE"
      fi
      gh pr merge "$PR" --squash --delete-branch
      git pull --ff-only origin "$RELEASE"
      git branch -D "$WORK" 2>/dev/null || true
      echo "merged $PR into $RELEASE"
