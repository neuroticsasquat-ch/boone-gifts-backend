[project]
name = "boone-gifts-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.156.8",
    "uvicorn>=0.54.0",
    # Below 2.1 until opentelemetry-instrumentation-sqlalchemy supports it: the 0.66b1
    # release caps sqlalchemy<2.1 and skips itself on 2.1, so no SQL spans reach SigNoz.
    # The strict xfail in tests/integration/test_opentelemetry_startup.py fails CI once
    # a release lifts the cap (contrib #5120) -- then drop this, it and the Dependabot ignore.
    "sqlalchemy>=2.0.55,<2.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "bcrypt>=5.0.0",
    "alembic>=1.20.0",
    "httpx>=0.28.1",
    "slowapi>=0.1.10",
    "sentry-sdk[fastapi]>=2.72.0",
    "opentelemetry-distro>=0.66b1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "opentelemetry-instrumentation-logging>=0.66b1",
]

[tool.pytest.ini_options]
# So a bare `task test` collects the suite only, as `pytest tests/` did.
testpaths = ["tests"]
filterwarnings = [
    "ignore::jwt.warnings.InsecureKeyLengthWarning",
    # slowapi 0.1.9 calls asyncio.iscoroutinefunction which is deprecated in
    # Python 3.14 (removed in 3.16). Upstream fix is pending — silence until
    # slowapi releases a new version.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:slowapi.extension",
]

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
