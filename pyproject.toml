[project]
name = "boone-gifts-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "sqlalchemy>=2.0.46",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "pyjwt>=2.11.0",
    "bcrypt>=5.0.0",
    "alembic>=1.18.3",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::jwt.warnings.InsecureKeyLengthWarning",
]

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.408",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
