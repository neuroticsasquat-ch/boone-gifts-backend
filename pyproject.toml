[project]
name = "boone-gifts-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.2",
    "uvicorn>=0.51.0",
    "sqlalchemy>=2.0.51",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "bcrypt>=5.0.0",
    "alembic>=1.18.5",
    "httpx>=0.28.1",
    "slowapi>=0.1.10",
    "sentry-sdk[fastapi]>=2.66.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::jwt.warnings.InsecureKeyLengthWarning",
    # slowapi 0.1.9 calls asyncio.iscoroutinefunction which is deprecated in
    # Python 3.14 (removed in 3.16). Upstream fix is pending — silence until
    # slowapi releases a new version.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:slowapi.extension",
]

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
