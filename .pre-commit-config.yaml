minimum_pre_commit_version: "3.5.0"

# Every hook calls a Taskfile target, and the target runs inside the dev container
# (tbc-localdev-infra/CONVENTIONS.md). The Taskfile is the only place the toolchain
# is invoked, so the hooks and `task <x>` can't drift apart. The container must be
# up (`task up`) and rebuilt after a dependency change (`task build`).
#
# Only what CI enforces runs here. ruff and pyright are not clean on the existing
# code yet (`task lint`, `task format:check`, `task typecheck`); add them as lint,
# format and typecheck hooks, in this same form, once they are.
repos:
  - repo: local
    hooks:
      - id: test
        name: test (container)
        entry: task test
        language: system
        pass_filenames: false
        files: \.py$|^pyproject\.toml$|^uv\.lock$
