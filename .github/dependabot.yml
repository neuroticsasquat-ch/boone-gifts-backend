version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "09:00"
      timezone: America/New_York
    target-branch: updates/dependencies
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Held below 2.1 until opentelemetry-instrumentation-sqlalchemy supports it (see
      # pyproject.toml); drop with the cap.
      - dependency-name: sqlalchemy
        versions: [">=2.1"]
