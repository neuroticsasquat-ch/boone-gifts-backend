name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        env:
          APP_DATABASE_URL: sqlite:///./data/boone_gifts.db
          APP_TEST_DATABASE_URL: sqlite:///./data/boone_gifts_test.db
          APP_JWT_SECRET: ci-test-secret
        run: |
          mkdir -p data
          uv run pytest tests/ -v
